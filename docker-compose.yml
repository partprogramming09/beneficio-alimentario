version: '3.8'
services:
      # Servicio 1: Laravel Backend (PHP 8.3)
      backend:
        build:
          context: .
          dockerfile: ./backend/Dockerfile
        ports:
          - "8000:8000"
        volumes:
          - ./backend:/var/www/html
          - ./backend/.env.docker:/var/www/html/.env
          - /var/www/html/vendor
        environment:
          - DB_HOST=mysql
          - DB_USER=root
          - DB_PASSWORD=root
          - DB_NAME=beneficio_alimentario
          - DB_PORT=3306
          - MYSQL_ATTR_SSL_CA=
        depends_on:
          mysql:
            condition: service_healthy

      # Servicio 2: Portal del Estudiante (Vite/Vue 3)
      frontend-estudiante:
        build:
          context: .
          dockerfile: ./frontend-estudiante/Dockerfile
        ports:
          - "5173:5173"
        volumes:
          - .:/usr/src/app
          - /usr/src/app/node_modules
          - /usr/src/app/frontend-estudiante/node_modules
          - /usr/src/app/frontend-core/node_modules
        depends_on:
          - backend

      # Servicio 3: Panel de la Coordinadora (Vite/Vue 3)
      frontend-coordinadora:
        build:
          context: .
          dockerfile: ./frontend-coordinadora/Dockerfile
        ports:
          - "5174:5174"
        volumes:
          - .:/usr/src/app
          - /usr/src/app/node_modules
          - /usr/src/app/frontend-coordinadora/node_modules
          - /usr/src/app/frontend-core/node_modules
        depends_on:
          - backend

      # Servicio 4: Base de Datos MySQL
      mysql:
        image: mysql:8.0
        ports:
          - "3307:3306"
        command: --default-authentication-plugin=mysql_native_password
        environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: beneficio_alimentario
        volumes:
          - mysql_data:/var/lib/mysql
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
          interval: 5s
          timeout: 5s
          retries: 10

volumes:
  mysql_data: